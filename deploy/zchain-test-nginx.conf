# ============================================================================
# ZChain 测试部署 — poker_texas_air 前端（zchain 子域，2026-09-22）
#
# 与生产 texas-nginx.conf（strk.secretpokers.com → /var/www/poker → :9001）
# 完全分离：独立 server block、独立证书、代理到 **:1443 测试后端**
# （/opt/texas-test/texas，appchain→zchain 结算，STARKNET_RPC_URL 留空 dev 模式）。
#
# 部署位置：stark:/etc/nginx/conf.d/zchain-test.conf
# 证书：certbot certonly --nginx -d zchain.secretpokers.com（独立签发，
#       自动续期由系统 certbot.timer 覆盖 live/ 下全部证书）
# 静态目录：/var/www/zchain-test/dist（由 scripts/deploy_client_zchain_test.sh 上传）
#
# 修改本文件后：scp 到 stark:/etc/nginx/conf.d/ 并执行 nginx -t && reload。
# 不会触碰生产 poker.conf / /var/www/poker / :9001。
# ============================================================================
server {
    listen 443 ssl;
    server_name zchain.secretpokers.com;

    root /var/www/zchain-test/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/zchain.secretpokers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zchain.secretpokers.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 代理（/opt/texas-test 测试后端，非生产 9001）
    location /api/ {
        proxy_pass http://127.0.0.1:1443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 代理（socket.io；前端 VITE_SERVER_URI 指向本域名 → 同源经此升级）
    location /socket.io/ {
        proxy_pass http://127.0.0.1:1443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态资源缓存（含 client-wasm 的 .wasm 产物）
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # JS/CSS 缓存（Vite 产物自带 hash）
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# HTTP → HTTPS（仅本子域；生产 poker.conf 的 :80 default_server 不受影响）
server {
    listen 80;
    server_name zchain.secretpokers.com;
    return 301 https://$host$request_uri;
}
